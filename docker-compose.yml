services:
  sts-api:
    image: sts-api:latest
    container_name: sts-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./data.json:/app/data.json:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Sts__DataFilePath=/app/data.json
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=sts-api
      - Jwt__Audience=sts-admin
      - Admin__Username=${ADMIN_USERNAME}
      - Admin__Password=${ADMIN_PASSWORD}
      - ConnectionStrings__StsDb=Data Source=/data/sts.db
      - Images__StoragePath=/data/images
      - Images__BaseUrl=https://api.nlrp.fr/images

  sts-web:
    image: sts-web:latest
    container_name: sts-web
    restart: unless-stopped
    ports:
      - "8081:80"
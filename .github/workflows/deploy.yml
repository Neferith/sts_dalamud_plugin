name: Deploy STS.Api

on:
  push:
    branches: [ master ]
    paths:
      - 'STS.Domain/**'
      - 'STS.Api/**'
      - 'Dockerfile'
      - 'docker-compose.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t sts-api:latest -f Dockerfile .

      - name: Save image as tar
        run: |
          docker save sts-api:latest | gzip > sts-api.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "sts-api.tar.gz,docker-compose.yml"
          target: "~/sts"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/sts

            # Charger la nouvelle image
            docker load < sts-api.tar.gz
            rm sts-api.tar.gz

            # Redémarrer le container
            docker compose down
            docker compose up -d

            # Nettoyage des anciennes images
            docker image prune -f
